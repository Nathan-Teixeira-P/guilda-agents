<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Emblema NTP: anel externo (7 divisões) mostra o uso semanal; anel interno (5 divisões) mostra a janela de 5 horas">
  <style>
    .track{fill:none;stroke:#2a1a17;stroke-width:14}
    .arc{fill:none;stroke-width:14;transform:rotate(-90deg);transform-origin:200px 200px}
    .week{stroke:#a9adb3} .five{stroke:#c1121f}
    .tick{stroke:#0b0707;stroke-width:3}
  </style>
  <defs><radialGradient id="bg" cx="50%" cy="45%" r="60%"><stop offset="0" stop-color="#241416"/><stop offset="1" stop-color="#0c0809"/></radialGradient>
  <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d8dade"/><stop offset=".5" stop-color="#6c7078"/><stop offset="1" stop-color="#2c2f35"/></linearGradient></defs>
  <circle cx="200" cy="200" r="196" fill="url(#bg)"/>
  <circle cx="200" cy="200" r="190" fill="none" stroke="url(#rim)" stroke-width="8"/>
  <circle class="track" cx="200" cy="200" r="164"/><circle class="arc week" cx="200" cy="200" r="164" pathLength="100" stroke-dasharray="62 100"/>
  <circle class="track" cx="200" cy="200" r="140"/><circle class="arc five" cx="200" cy="200" r="140" pathLength="100" stroke-dasharray="35 100"/>
  <g class="tick"><g transform="rotate(0.00 200 200)"><line x1="200" y1="29" x2="200" y2="43"/></g><g transform="rotate(51.43 200 200)"><line x1="200" y1="29" x2="200" y2="43"/></g><g transform="rotate(102.86 200 200)"><line x1="200" y1="29" x2="200" y2="43"/></g><g transform="rotate(154.29 200 200)"><line x1="200" y1="29" x2="200" y2="43"/></g><g transform="rotate(205.71 200 200)"><line x1="200" y1="29" x2="200" y2="43"/></g><g transform="rotate(257.14 200 200)"><line x1="200" y1="29" x2="200" y2="43"/></g><g transform="rotate(308.57 200 200)"><line x1="200" y1="29" x2="200" y2="43"/></g><g transform="rotate(0 200 200)"><line x1="200" y1="53" x2="200" y2="67"/></g><g transform="rotate(72 200 200)"><line x1="200" y1="53" x2="200" y2="67"/></g><g transform="rotate(144 200 200)"><line x1="200" y1="53" x2="200" y2="67"/></g><g transform="rotate(216 200 200)"><line x1="200" y1="53" x2="200" y2="67"/></g><g transform="rotate(288 200 200)"><line x1="200" y1="53" x2="200" y2="67"/></g></g>
  <image href="emblem-ntp.png" x="108" y="88" width="184" height="226" preserveAspectRatio="xMidYMid meet"/>
</svg>